    Research Experience:
      - company: University of Florida
        position: Graduate Research Assistant
        location: Gainesville, FL
        start_date: 2023-08
        summary: "Active perception and uncertainty representations in GPS-denied environments (Advisor: Jaejeong Shin)"
        highlights:
          - "Developed an uncertainty-aware magnetic navigation planner that, compared with state-of-the-art methods, improves localization accuracy by 5%, cuts failure rates by 34%, and reduces computational costs by over 99% [J1]."
          - "Built neural and Bayesian neural network models of magnetometer sensing and magnetic fields, including expandable maps with calibrated uncertainty when compared to Gaussian process baselines [C6, R1]."
          - "Characterized how gradients in scalar fields determine localizability and used this for information-driven planning [R2]."
          - "Designed research drones for information-aware guidance; built a magnetic navigation simulator in NVIDIA Isaac Sim, Gazebo, and ROS2."
          - "Developed low- and high-level software for an underwater vehicle (thrust mapping, filtering, closed-loop control) and a gesture-driven diver-following controller with transformer-based gesture recognition [C3]."
          - "Built radar–vision fusion tracking (YOLO detection, global nearest-neighbor association) for the U.S. Navy NSWC Crane Robust AI Test Event (RAITE), evaluated under adversarial attack [C5]."

      - company: Center for Intelligent Machines and Robots, University of Florida
        position: Lab Assistant
        location: Gainesville, FL
        start_date: 2021-09
        end_date: 2023-08
        summary: "Research on mechanically connected systems to evaluate kinematic feasibility (Advisor: Carl D. Crane III)"
        highlights:
          - "Automated a go-kart with GNSS and LiDAR navigation; implemented ROS2 path planning, SLAM, LiDAR mapping and localization, and UKF-based sensor fusion."
          - "M.S. thesis (Advisor: Carl D. Crane III): mechanical network analysis of closed-loop mechanisms (four-bar, Stephenson, and parallel) for geometric mobility, joint displacement, and internal joint preload."

